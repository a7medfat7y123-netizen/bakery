<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الأدمن - Bakery</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f6efe6; --card: #fff; --ink: #3b2a1e; --muted: #8a7666;
    --accent: #b5652b; --line: #eadfd2;
    --new: #2f6fd6; --preparing: #d68a1f; --delivered: #1f9d55; --cancelled: #b23b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1612; --card: #27201a; --ink: #f3e9de; --muted: #b3a191; --accent: #e39a5f; --line: #3a2f26; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Cairo", system-ui, sans-serif; line-height: 1.6; }
  .hidden { display: none !important; }
  button, input, select { font: inherit; }
  .btn { border: none; cursor: pointer; font-weight: 700; color: #fff; background: var(--accent); border-radius: 12px; padding: 10px 18px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }

  /* تسجيل الدخول */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login form { width: min(380px, 100%); background: var(--card); border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.4); }
  .login h1 { margin: 0; text-align: center; color: var(--accent); }
  .login p { margin: 0 0 18px; text-align: center; color: var(--muted); }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .login .btn { width: 100%; padding: 12px; margin-top: 6px; }
  .error { color: #c0392b; text-align: center; min-height: 1.4em; margin: 8px 0 0; font-size: .9rem; }

  /* اللوحة */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .top h1 { margin: 0; font-size: 1.2rem; color: var(--accent); flex: 1; }
  .top small { color: var(--muted); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4); }
  .stat small { color: var(--muted); display: block; }
  .stat b { font-size: 1.6rem; }
  .tabs { display: flex; gap: 8px; margin: 20px 0 12px; align-items: center; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 700; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabs select { margin-inline-start: auto; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .list { display: grid; gap: 12px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 8px 20px -14px rgba(0,0,0,.4); border-inline-start: 5px solid var(--line); }
  .card[data-status="new"] { border-inline-start-color: var(--new); }
  .card[data-status="preparing"] { border-inline-start-color: var(--preparing); }
  .card[data-status="delivered"] { border-inline-start-color: var(--delivered); }
  .card[data-status="cancelled"] { border-inline-start-color: var(--cancelled); opacity: .7; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .row .grow { flex: 1; }
  .no { font-weight: 800; direction: ltr; }
  .muted { color: var(--muted); font-size: .88rem; }
  .items { margin: 8px 0; padding: 8px 12px; background: var(--bg); border-radius: 12px; font-size: .92rem; }
  .items div { display: flex; justify-content: space-between; gap: 8px; }
  .total { font-weight: 800; color: var(--accent); font-size: 1.1rem; }
  .pill { padding: 1px 10px; border-radius: 999px; background: var(--bg); font-size: .85rem; }
  .status { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; }
  .contact a { color: var(--accent); text-decoration: none; font-weight: 700; }
  .msg { white-space: pre-wrap; margin: 6px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* تبويب المنيو */
  .forms { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .addform h3 { margin: 0 0 10px; color: var(--accent); }
  .addform .btn { width: 100%; margin-top: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field select, .field input[type=file] { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .92rem; cursor: pointer; }
  .note { margin: 8px 0 0; text-align: center; font-size: .9rem; min-height: 1.3em; }
  .note.ok { color: var(--delivered); } .note.bad { color: #c0392b; }
  .tip { margin: 16px 0 8px; }
  .catbox { margin-top: 18px; }
  .cathead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .cathead h3 { margin: 0; font-size: 1.15rem; }
  .cathead .grow { flex: 1; }
  .prow {
    display: grid; grid-template-columns: 56px 1fr 110px auto; gap: 10px; align-items: center;
    background: var(--card); border-radius: 14px; padding: 8px 10px; margin-bottom: 8px;
    box-shadow: 0 6px 16px -12px rgba(0,0,0,.4);
  }
  .prow.off { opacity: .55; }
  .thumb { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; font-size: 1.8rem; background: var(--bg); cursor: pointer; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb::after { content: "📷"; position: absolute; inset-inline-end: 2px; bottom: 0; font-size: .8rem; }
  .prow input[type=text], .prow input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  .pact { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .sm { padding: 6px 12px; border-radius: 10px; font-size: .85rem; }
  .sm.save:disabled { opacity: .35; cursor: default; }
  .sm.del { background: transparent; color: #c0392b; border: 1px solid rgba(192,57,43,.4); }
  .switch { display: inline-flex; align-items: center; gap: 4px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  @media (max-width: 640px) {
    .prow { grid-template-columns: 56px 1fr 90px; }
    .pact { grid-column: 1 / -1; justify-content: space-between; }
  }
</style>
</head>
<body>

<section class="login" id="loginView">
  <form id="loginForm">
    <h1>🥐 Bakery</h1>
    <p>لوحة الأدمن</p>
    <label class="field"><span>الإيميل</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>كلمة السر</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">دخول</button>
    <p class="error" id="loginError"></p>
  </form>
</section>

<section class="hidden" id="appView">
  <div class="top">
    <h1>🥐 لوحة الأدمن</h1>
    <small id="who"></small>
    <button class="btn ghost" id="refresh" type="button">🔄 تحديث</button>
    <button class="btn ghost" id="logout" type="button">خروج</button>
  </div>
  <div class="wrap">
    <p class="error" id="appError"></p>
    <div class="stats">
      <div class="stat"><small>طلبات النهارده</small><b id="sToday">0</b></div>
      <div class="stat"><small>مبيعات النهارده</small><b id="sSales">0</b></div>
      <div class="stat"><small>طلبات جديدة</small><b id="sNew">0</b></div>
      <div class="stat"><small>الرسائل</small><b id="sMsgs">0</b></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="orders" type="button">🛒 الطلبات</button>
      <button class="tab" data-tab="messages" type="button">✉️ الرسائل</button>
      <button class="tab" data-tab="menu" type="button">🍞 المنيو والأسعار</button>
      <select id="filter" aria-label="فلتر الحالة">
        <option value="">كل الطلبات</option>
        <option value="new">جديد</option>
        <option value="preparing">بيتجهز</option>
        <option value="delivered">اتسلّم</option>
        <option value="cancelled">ملغي</option>
      </select>
    </div>
    <div class="list" id="orders"></div>
    <div class="list hidden" id="messages"></div>

    <div class="hidden" id="menuAdmin">
      <div class="forms">
        <form class="card addform" id="addProduct">
          <h3>➕ صنف جديد</h3>
          <label class="field"><span>اسم الصنف</span><input name="name" maxlength="100" required></label>
          <div class="two">
            <label class="field"><span>السعر (جنيه)</span><input name="price" type="number" min="0" step="1" inputmode="numeric" required></label>
            <label class="field"><span>القسم</span><select name="category" required></select></label>
          </div>
          <label class="field"><span>الصورة (اختياري)</span><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
          <button class="btn" type="submit">إضافة الصنف</button>
          <p class="note" id="addProductMsg"></p>
        </form>
        <form class="card addform" id="addCategory">
          <h3>🗂️ قسم جديد</h3>
          <label class="field"><span>اسم القسم</span><input name="name" maxlength="60" required></label>
          <label class="check"><input name="hidden" type="checkbox"> قسم مقفول يتفتح بالضغط (زي المعجنات الدايت)</label>
          <label class="field"><span>وصف قصير (اختياري)</span><input name="note" maxlength="200"></label>
          <button class="btn ghost" type="submit">إضافة القسم</button>
          <p class="note" id="addCategoryMsg"></p>
        </form>
      </div>
      <p class="muted tip">💡 عدّل الاسم أو السعر واضغط <b>حفظ</b>. التعديل بيظهر في الموقع على طول لما الزبون يفتح الصفحة.</p>
      <div id="menuList"></div>
    </div>
  </div>
</section>

<script>
  // نفس مشروع Supabase بتاع الموقع — المفتاح الـ publishable بس
  const SUPABASE_URL = "https://hidjlsdcwnsgmrqnlphy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_UnTwNkLzJw5RKjBHPMdF7Q_yIxAYXGy";
  const CURRENCY = "جنيه";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => `${n} ${CURRENCY}`;
  const when = t => new Date(t).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" });
  const STATUS = { new: "🆕 جديد", preparing: "👨‍🍳 بيتجهز", delivered: "✅ اتسلّم", cancelled: "❌ ملغي" };
  const PAY = { cash: "💵 كاش", instapay: "⚡ إنستاباي", wallet: "📱 محفظة" };
  let orders = [], messages = [], timer;

  // ===== الدخول =====
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target.elements;
    $("loginError").textContent = "";
    const { error } = await db.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) $("loginError").textContent = "الإيميل أو كلمة السر غلط";
  });
  $("logout").onclick = () => db.auth.signOut();

  db.auth.onAuthStateChange((_event, session) => {
    if (session) show(session.user.email); else hide();
  });

  async function show(email) {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    $("who").textContent = email;
    const { data: ok } = await db.rpc("is_admin");
    if (!ok) { $("appError").textContent = "الحساب ده مش متسجّل كأدمن."; return; }
    $("appError").textContent = "";
    load();
    clearInterval(timer);
    timer = setInterval(load, 30000); // تحديث تلقائي كل 30 ثانية
  }
  function hide() {
    clearInterval(timer);
    $("appView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }

  // ===== البيانات =====
  async function load() {
    const [o, m] = await Promise.all([
      db.from("orders").select("*").order("created_at", { ascending: false }).limit(500),
      db.from("messages").select("*").order("created_at", { ascending: false }).limit(500),
    ]);
    if (o.error || m.error) { $("appError").textContent = "حصلت مشكلة في تحميل البيانات"; return; }
    $("appError").textContent = "";
    orders = o.data; messages = m.data;
    renderStats(); renderOrders(); renderMessages();
  }
  $("refresh").onclick = load;

  function renderStats() {
    const today = new Date().toDateString();
    const todays = orders.filter(o => new Date(o.created_at).toDateString() === today);
    $("sToday").textContent = todays.length;
    $("sSales").textContent = money(todays.filter(o => o.status !== "cancelled").reduce((s, o) => s + o.total, 0));
    $("sNew").textContent = orders.filter(o => o.status === "new").length;
    $("sMsgs").textContent = messages.length;
  }

  function renderOrders() {
    const f = $("filter").value;
    const list = orders.filter(o => !f || o.status === f);
    $("orders").innerHTML = list.map(o => `
      <article class="card" data-status="${esc(o.status)}">
        <div class="row">
          <span class="no">#${esc(o.order_no)}</span>
          <span class="muted grow">${when(o.created_at)}</span>
          <select class="status" data-id="${o.id}" aria-label="حالة الطلب">
            ${Object.entries(STATUS).map(([v, t]) => `<option value="${v}" ${v === o.status ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
        <div class="row contact">
          <b>👤 ${esc(o.customer_name)}</b>
          <a href="tel:${esc(o.customer_phone)}" dir="ltr">📞 ${esc(o.customer_phone)}</a>
          <a href="https://wa.me/2${esc(o.customer_phone.replace(/\D/g, "").replace(/^2/, ""))}" target="_blank" rel="noopener">💬 واتساب</a>
        </div>
        <div class="muted">${o.delivery ? `🛵 توصيل — 📍 ${esc(o.address)}` : "🏪 استلام من المخبز"}</div>
        <div class="items">${(o.items || []).map(l => `<div><span>${esc(l.name)} × ${esc(l.qty)}</span><span>${money(esc(l.total))}</span></div>`).join("")}</div>
        <div class="row">
          <span class="pill">${PAY[o.payment] || esc(o.payment)}</span>
          ${o.delivery_fee ? `<span class="muted">توصيل ${money(o.delivery_fee)}</span>` : ""}
          <span class="grow"></span>
          <span class="total">${money(o.total)}</span>
        </div>
        ${o.notes ? `<p class="msg muted">📝 ${esc(o.notes)}</p>` : ""}
      </article>`).join("") || `<p class="empty">مفيش طلبات</p>`;
  }

  function renderMessages() {
    $("messages").innerHTML = messages.map(m => `
      <article class="card">
        <div class="row contact">
          <b class="grow">👤 ${esc(m.name)}</b>
          <a href="tel:${esc(m.phone)}" dir="ltr">📞 ${esc(m.phone)}</a>
          <span class="muted">${when(m.created_at)}</span>
        </div>
        <p class="msg">${esc(m.message)}</p>
      </article>`).join("") || `<p class="empty">مفيش رسائل</p>`;
  }

  // تغيير حالة الطلب
  $("orders").addEventListener("change", async e => {
    const sel = e.target.closest("select.status");
    if (!sel) return;
    const id = Number(sel.dataset.id);
    const { error } = await db.from("orders").update({ status: sel.value }).eq("id", id);
    if (error) { $("appError").textContent = "مقدرتش أغيّر الحالة، جرّب تاني"; return load(); }
    const o = orders.find(x => x.id === id);
    if (o) o.status = sel.value;
    renderStats(); renderOrders();
  });

  $("filter").onchange = renderOrders;
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    const tab = t.dataset.tab;
    $("orders").classList.toggle("hidden", tab !== "orders");
    $("messages").classList.toggle("hidden", tab !== "messages");
    $("menuAdmin").classList.toggle("hidden", tab !== "menu");
    $("filter").classList.toggle("hidden", tab !== "orders");
    if (tab === "menu") loadMenuAdmin();
  });

  // ===== المنيو والأسعار =====
  let cats = [], prods = [];
  const isImg = s => /^(https?:|images\/)/.test(s || "");
  const thumb = img => isImg(img) ? `<img src="${esc(img)}" alt="">` : esc(img || "🍞");

  async function loadMenuAdmin() {
    const [c, p] = await Promise.all([
      db.from("categories").select("*").order("sort").order("id"),
      db.from("products").select("*").order("sort").order("id"),
    ]);
    if (c.error || p.error) { $("appError").textContent = "مقدرتش أحمّل المنيو"; return; }
    cats = c.data; prods = p.data;
    $("addProduct").elements.category.innerHTML = cats.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    renderMenuAdmin();
  }

  function renderMenuAdmin() {
    $("menuList").innerHTML = cats.map(c => {
      const rows = prods.filter(p => p.category_id === c.id).map(p => `
        <div class="prow${p.available ? "" : " off"}" data-id="${p.id}">
          <label class="thumb" title="تغيير الصورة">${thumb(p.image)}<input type="file" accept="image/jpeg,image/png,image/webp" hidden data-photo="${p.id}"></label>
          <input type="text" value="${esc(p.name)}" data-f="name" maxlength="100" aria-label="اسم الصنف">
          <input type="number" value="${p.price}" data-f="price" min="0" step="1" aria-label="السعر">
          <div class="pact">
            <label class="switch"><input type="checkbox" data-avail="${p.id}" ${p.available ? "checked" : ""}> ظاهر</label>
            <button class="btn sm save" type="button" data-save="${p.id}" disabled>حفظ</button>
            <button class="btn sm del" type="button" data-del="${p.id}">حذف</button>
          </div>
        </div>`).join("");
      return `<section class="catbox">
        <div class="cathead">
          <h3>${c.hidden ? "🥗" : "📂"} ${esc(c.name)}</h3>
          <span class="muted grow">${prods.filter(p => p.category_id === c.id).length} صنف</span>
          <label class="switch"><input type="checkbox" data-cathidden="${c.id}" ${c.hidden ? "checked" : ""}> قسم مقفول</label>
          <button class="btn sm del" type="button" data-catdel="${c.id}">حذف القسم</button>
        </div>
        ${rows || `<p class="muted">مفيش أصناف في القسم ده لسه.</p>`}
      </section>`;
    }).join("") || `<p class="empty">مفيش أقسام</p>`;
  }

  // يصغّر صورة الموبايل قبل الرفع (أقصى عرض 1000 بكسل)
  async function shrink(file) {
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return new Promise(res => cv.toBlob(res, "image/jpeg", 0.85));
  }
  async function uploadPhoto(file) {
    const blob = await shrink(file);
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await db.storage.from("products").upload(path, blob, { contentType: "image/jpeg" });
    if (error) throw error;
    return db.storage.from("products").getPublicUrl(path).data.publicUrl;
  }

  const say = (id, text, ok) => { $(id).textContent = text; $(id).className = "note " + (ok ? "ok" : "bad"); };

  $("addProduct").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target.elements, btn = e.target.querySelector("button");
    const name = f.name.value.trim(), price = Number(f.price.value);
    if (!name || !(price >= 0) || f.price.value === "") return say("addProductMsg", "اكتب الاسم والسعر", false);
    btn.disabled = true; say("addProductMsg", "جاري الإضافة...", true);
    try {
      const image = f.photo.files[0] ? await uploadPhoto(f.photo.files[0]) : "🍞";
      const catId = Number(f.category.value);
      const sort = Math.max(0, ...prods.filter(p => p.category_id === catId).map(p => p.sort)) + 1;
      const { error } = await db.from("products").insert({ category_id: catId, name, price, image, sort });
      if (error) throw error;
      e.target.reset();
      say("addProductMsg", `✅ اتضاف "${name}"`, true);
      loadMenuAdmin();
    } catch { say("addProductMsg", "حصلت مشكلة، جرّب تاني", false); }
    btn.disabled = false;
  });

  $("addCategory").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target.elements;
    const name = f.name.value.trim();
    if (!name) return say("addCategoryMsg", "اكتب اسم القسم", false);
    const sort = Math.max(0, ...cats.map(c => c.sort)) + 1;
    const { error } = await db.from("categories").insert({ name, hidden: f.hidden.checked, note: f.note.value.trim() || null, sort });
    if (error) return say("addCategoryMsg", error.code === "23505" ? "القسم ده موجود" : "حصلت مشكلة", false);
    e.target.reset();
    say("addCategoryMsg", `✅ اتضاف قسم "${name}"`, true);
    loadMenuAdmin();
  });

  // تعديل الاسم/السعر بيفعّل زرار الحفظ
  $("menuList").addEventListener("input", e => {
    const row = e.target.closest(".prow");
    if (row && e.target.dataset.f) row.querySelector("[data-save]").disabled = false;
  });

  $("menuList").addEventListener("click", async e => {
    const save = e.target.closest("[data-save]"), del = e.target.closest("[data-del]"), catdel = e.target.closest("[data-catdel]");
    if (save) {
      const row = save.closest(".prow");
      const name = row.querySelector('[data-f="name"]').value.trim();
      const price = Number(row.querySelector('[data-f="price"]').value);
      if (!name || !(price >= 0)) return alert("اكتب اسم وسعر صحيح");
      save.disabled = true; save.textContent = "...";
      const { error } = await db.from("products").update({ name, price }).eq("id", Number(save.dataset.save));
      save.textContent = error ? "حفظ" : "✓ اتحفظ";
      if (error) { save.disabled = false; alert("مقدرتش أحفظ، جرّب تاني"); }
      else { const p = prods.find(x => x.id === Number(save.dataset.save)); Object.assign(p, { name, price }); setTimeout(() => save.textContent = "حفظ", 1500); }
    }
    if (del) {
      const p = prods.find(x => x.id === Number(del.dataset.del));
      if (!confirm(`حذف "${p.name}" نهائياً؟\n(لو عايز تخفيه مؤقتاً شيل علامة "ظاهر" بدل الحذف)`)) return;
      const { error } = await db.from("products").delete().eq("id", p.id);
      if (error) return alert("مقدرتش أحذف");
      loadMenuAdmin();
    }
    if (catdel) {
      const c = cats.find(x => x.id === Number(catdel.dataset.catdel));
      const n = prods.filter(p => p.category_id === c.id).length;
      if (!confirm(`حذف قسم "${c.name}"${n ? ` وكل أصنافه (${n})` : ""} نهائياً؟`)) return;
      const { error } = await db.from("categories").delete().eq("id", c.id);
      if (error) return alert("مقدرتش أحذف");
      loadMenuAdmin();
    }
  });

  $("menuList").addEventListener("change", async e => {
    const avail = e.target.dataset.avail, cath = e.target.dataset.cathidden, photo = e.target.dataset.photo;
    if (avail) {
      const { error } = await db.from("products").update({ available: e.target.checked }).eq("id", Number(avail));
      if (error) { e.target.checked = !e.target.checked; return alert("مقدرتش أغيّر"); }
      e.target.closest(".prow").classList.toggle("off", !e.target.checked);
      prods.find(p => p.id === Number(avail)).available = e.target.checked;
    }
    if (cath) {
      const { error } = await db.from("categories").update({ hidden: e.target.checked }).eq("id", Number(cath));
      if (error) { e.target.checked = !e.target.checked; return alert("مقدرتش أغيّر"); }
      loadMenuAdmin();
    }
    if (photo && e.target.files[0]) {
      const box = e.target.closest(".thumb");
      box.style.opacity = .4;
      try {
        const image = await uploadPhoto(e.target.files[0]);
        const { error } = await db.from("products").update({ image }).eq("id", Number(photo));
        if (error) throw error;
        loadMenuAdmin();
      } catch { box.style.opacity = 1; alert("مقدرتش أرفع الصورة"); }
    }
  });
</script>
</body>
</html>
