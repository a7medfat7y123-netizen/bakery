<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قائمة الأسعار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6ef;
    --card: #ffffff;
    --ink: #3b2a1e;
    --muted: #8a7666;
    --accent: #b5652b;
    --line: #eadfd2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1612;
      --card: #27201a;
      --ink: #f3e9de;
      --muted: #b3a191;
      --accent: #e39a5f;
      --line: #3a2f26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Cairo", system-ui, sans-serif;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 40px 16px 24px;
  }
  header h1 { margin: 0; font-size: 2rem; font-weight: 800; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .search {
    display: block;
    width: 100%;
    max-width: 640px;
    margin: 0 auto 8px;
    padding: 12px 16px;
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
  }
  main { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 20px;
    margin-top: 20px;
  }
  section h2 {
    margin: 12px 0 4px;
    font-size: 1.2rem;
    color: var(--accent);
  }
  .item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  section h2 + .item { border-top: none; }
  .price { font-weight: 600; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0 16px 32px;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1 id="name"></h1>
  <p>قائمة الأسعار</p>
</header>

<main>
  <input class="search" id="search" type="search" placeholder="ابحث عن صنف...">
  <div id="menu"></div>
</main>

<footer id="contact"></footer>

<script>
  // ===== عدّل البيانات من هنا =====
  const BAKERY_NAME = "مخبز أحمد فتحي";
  const CURRENCY = "جنيه";
  const PHONE = ""; // مثال: "01000000000"
  const ADDRESS = "";

  const MENU = [
    { category: "المخبوزات", items: [
      ["عيش بلدي (الرغيف)", 1],
      ["عيش فينو (الرغيف)", 2],
      ["عيش شامي (الكيس)", 15],
      ["توست (الكيس)", 35],
      ["كرواسون سادة", 15],
      ["كرواسون شوكولاتة", 20],
    ]},
    { category: "المعجنات", items: [
      ["فطيرة جبنة", 25],
      ["فطيرة لحمة مفرومة", 40],
      ["بيتزا صغيرة", 45],
      ["سينابون", 30],
    ]},
    { category: "الحلويات", items: [
      ["كيك شوكولاتة (القطعة)", 25],
      ["بسبوسة (الكيلو)", 120],
      ["كحك العيد (الكيلو)", 200],
      ["بسكويت بالسمن (الكيلو)", 150],
    ]},
    { category: "التورت", items: [
      ["تورتة شوكولاتة (صغيرة)", 250],
      ["تورتة فانيليا بالفواكه (صغيرة)", 280],
      ["تورتة بلاك فورست (كبيرة)", 450],
    ]},
  ];
  // ===== نهاية البيانات =====

  document.getElementById("name").textContent = BAKERY_NAME;
  document.title = "قائمة الأسعار - " + BAKERY_NAME;

  const contact = [];
  if (PHONE) contact.push(`📞 <a href="tel:${PHONE}">${PHONE}</a> · <a href="https://wa.me/2${PHONE}">واتساب</a>`);
  if (ADDRESS) contact.push(`📍 ${ADDRESS}`);
  document.getElementById("contact").innerHTML = contact.join("<br>");

  function render(filter = "") {
    const q = filter.trim();
    const html = MENU.map(({ category, items }) => {
      const rows = items
        .filter(([name]) => !q || name.includes(q) || category.includes(q))
        .map(([name, price]) =>
          `<div class="item"><span>${name}</span><span class="price">${price} ${CURRENCY}</span></div>`)
        .join("");
      return rows ? `<section><h2>${category}</h2>${rows}</section>` : "";
    }).join("");
    document.getElementById("menu").innerHTML = html || `<p class="empty">لا توجد نتائج</p>`;
  }

  document.getElementById("search").addEventListener("input", e => render(e.target.value));
  render();
</script>
</body>
</html>
